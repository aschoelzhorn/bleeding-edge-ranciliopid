[platformio]
#lib_dir = libraries/
src_dir = rancilio-pid/
default_envs = esp32_ota_DEV

[env]
lib_ldf_mode = chain  # https://github.com/Links2004/arduinoWebSockets/issues/635
lib_compat_mode = strict
build_flags = 
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=-1
    -DTFT_DC=27
    -DTFT_RST=33
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000

[env:nodemcuv2_usb]
platform = espressif8266@^4.0
board = nodemcuv2
board_build.mcu = esp8266
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain+
build_flags = 
    -include "rancilio-pid/RemoteDebugCfg.h"
    -include "rancilio-pid/scaleConfigOverwrite.h"
    ${env.build_flags}     
lib_ignore =
    WiFi
lib_deps =
    RemoteDebug_fix=https://github.com/medlor/RemoteDebug
    #lebuni/ZACwire for TSic @ 1.3.3
    ZACwire for TSic fix=https://github.com/medlor/ZACwire-Library#improve_esp32_support_v2.0.0
    olikraus/U8g2 @ ^2.34.3
    blynkkk/Blynk @ ^1.2.0
    knolleary/PubSubClient @ ^2.8
    pololu/VL53L0X @ ^1.3.1
    uMQTTBroker_latest=https://github.com/martin-ger/uMQTTBroker/
    fastled/FastLED @ ^3.5.0
    adafruit/MAX6675 library @ ^1.1.0
	#olkal/HX711_ADC@^1.2.11
    HX711_ADC_fix=https://github.com/medlor/HX711_ADC#1.2.12_pcp_v1
	bodmer/TFT_eSPI
	bodmer/TFT_eWidget

[env:nodemcuv2_ota]
platform = espressif8266@^4.0
board = nodemcuv2
board_build.mcu = esp8266
framework = arduino
monitor_speed = 115200
upload_protocol = espota
upload_port = rancilio
upload_flags =
    --auth=${sysenv.OTAPASSWORD}
lib_ldf_mode = chain+
build_flags = 
    -include "rancilio-pid/RemoteDebugCfg.h"
    -include "rancilio-pid/scaleConfigOverwrite.h"
    ${env.build_flags}     
lib_ignore =
    WiFi
lib_deps =
    RemoteDebug_fix=https://github.com/medlor/RemoteDebug
    #lebuni/ZACwire for TSic @ 1.3.3
    ZACwire for TSic fix=https://github.com/medlor/ZACwire-Library#improve_esp32_support_v2.0.0
    olikraus/U8g2 @ ^2.34.3
    blynkkk/Blynk @ ^1.2.0
    knolleary/PubSubClient @ ^2.8
    pololu/VL53L0X @ ^1.3.1
    uMQTTBroker_latest=https://github.com/martin-ger/uMQTTBroker/
    fastled/FastLED @ ^3.5.0
    adafruit/MAX6675 library @ ^1.1.0
	#olkal/HX711_ADC@^1.2.11
    HX711_ADC_fix=https://github.com/medlor/HX711_ADC#1.2.12_pcp_v1
   	bodmer/TFT_eSPI
	bodmer/TFT_eWidget

[env:esp32_usb]
platform = espressif32@5.3
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = 
    -include "rancilio-pid/RemoteDebugCfg.h"
    -include "rancilio-pid/scaleConfigOverwrite.h"
    ${env.build_flags}     
lib_deps =
    RemoteDebug_fix=https://github.com/medlor/RemoteDebug
    #lebuni/ZACwire for TSic @ 1.3.3
    #ZACwire for TSic beta=https://github.com/lebuni/ZACwire-Library#beta
    ZACwire for TSic fix=https://github.com/medlor/ZACwire-Library#improve_esp32_support_v2.0.0
    olikraus/U8g2
    blynkkk/Blynk @ ^1.2.0
    knolleary/PubSubClient @ ^2.8
    pololu/VL53L0X @ ^1.3.1
    fastled/FastLED @ ^3.5.0
    adafruit/MAX6675 library @ ^1.1.0
	#olkal/HX711_ADC@^1.2.11
    HX711_ADC_fix=https://github.com/medlor/HX711_ADC#1.2.12_pcp_v1
	bodmer/TFT_eSPI
	bodmer/TFT_eWidget

