[platformio]
#lib_dir = libraries/
src_dir = rancilio-pid/
;default_envs = esp32_ota_DEV
;default_envs = esp32_ota_LIVE
default_envs = esp32_usb
;default_envs = nodemcuv2_ota

[env:TFT_eSPI]
build_flags = 
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=-1
    -DTFT_DC=27
    -DTFT_RST=33
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
lib_deps =   
	bodmer/TFT_eSPI
	bodmer/TFT_eWidget
    ESP Async Webserver

[env]
lib_ldf_mode = chain  # https://github.com/Links2004/arduinoWebSockets/issues/635
lib_compat_mode = strict
lib_deps =    
    RemoteDebug_fix=https://github.com/medlor/RemoteDebug
    ZACwire for TSic fix=https://github.com/medlor/ZACwire-Library#improve_esp32_support_v2.0.0
    olikraus/U8g2
    blynkkk/Blynk @ ^1.2.0
    knolleary/PubSubClient @ ^2.8
    pololu/VL53L0X @ ^1.3.1
    fastled/FastLED @ ^3.5.0
    adafruit/MAX6675 library
    HX711_ADC_fix=https://github.com/medlor/HX711_ADC#1.2.12_pcp_v1
    robtillaart/ADS1X15@^0.4.1

[env:nodemcuv2_usb]
platform = espressif8266
board = nodemcuv2
board_build.mcu = esp8266
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain+
build_flags = 
    -include "rancilio-pid/RemoteDebugCfg.h"
    -include "rancilio-pid/scaleConfigOverwrite.h"
lib_ignore =
    WiFi
lib_deps =
    uMQTTBroker_latest=https://github.com/martin-ger/uMQTTBroker/
    ${env.lib_deps}

[env:nodemcuv2_ota]
platform = espressif8266
board = nodemcuv2
board_build.mcu = esp8266
framework = arduino
monitor_speed = 115200
upload_protocol = espota
upload_port = rancilio
upload_flags =
    --auth=${sysenv.OTAPASSWORD}
lib_ldf_mode = chain+
build_flags = 
    -include "rancilio-pid/RemoteDebugCfg.h"
    -include "rancilio-pid/scaleConfigOverwrite.h"
lib_ignore =
    WiFi
lib_deps =
    uMQTTBroker_latest=https://github.com/martin-ger/uMQTTBroker/
    ${env.lib_deps}

[env:esp32_usb]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = min_spiffs.csv
upload_protocol = esptool
build_flags = 
    -include "rancilio-pid/RemoteDebugCfg.h"
    -include "rancilio-pid/scaleConfigOverwrite.h"
    ${env:TFT_eSPI.build_flags}
lib_deps =
    ${env.lib_deps}
    ${env:TFT_eSPI.lib_deps}
    mlesniew/PicoMQTT@^0.3.8

[env:esp32_ota_DEV]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_protocol = espota
upload_port = 192.168.1.245
board_build.partitions = min_spiffs.csv
upload_flags =
    --auth=${sysenv.OTAPASSWORD}
build_flags = 
    -include "rancilio-pid/RemoteDebugCfg.h"
    -include "rancilio-pid/scaleConfigOverwrite.h"
    ${env:TFT_eSPI.build_flags}
lib_deps =
    ${env.lib_deps}
    ${env:TFT_eSPI.lib_deps}
    mlesniew/PicoMQTT@^0.3.8

[env:esp32_ota_LIVE]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_protocol = espota
upload_port = rancilio
board_build.partitions = min_spiffs.csv
upload_flags =
    --auth=${sysenv.OTAPASSWORD}
build_flags = 
    -include "rancilio-pid/RemoteDebugCfg.h"
    -include "rancilio-pid/scaleConfigOverwrite.h" 
    ${env:TFT_eSPI.build_flags}
lib_deps =
    ${env.lib_deps}
    ${env:TFT_eSPI.lib_deps}
    mlesniew/PicoMQTT@^0.3.8
